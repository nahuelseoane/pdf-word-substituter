[project]
name = "pdf-word-substituter"
version = "0.1.0"
description = "Replace or remove text in PDF files, deleting the old text instead of covering it"
readme = "README.md"
authors = [
    { name = "Nahuel", email = "nahuelseoane@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2",
]

[project.scripts]
pdf-word-substituter = "pdf_word_substituter:main"
pdf-word-substituter-gui = "pdf_word_substituter.gui:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
